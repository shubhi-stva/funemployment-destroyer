name: Collect jobs

# "As soon as it is posted", within what a static site can do: GitHub's cron
# queue makes anything tighter than ~30 minutes unreliable in practice.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      include_unspecified:
        description: "Also keep full-time roles that never mention a degree"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/collect.yml"

# A long run must never overlap the next scheduled tick.
concurrency:
  group: collect-jobs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh company board list
        run: python scripts/refresh_companies.py
        continue-on-error: true

      - name: Collect jobs
        env:
          FD_MAX_WORKERS: "32"
          FD_INCLUDE_UNSPECIFIED: ${{ inputs.include_unspecified && '1' || '0' }}
        run: python scripts/collect.py

      - name: Commit if the listings actually changed
        run: |
          git config user.name  "Shubhi Srivastava"
          git config user.email "shubhistva@icloud.com"

          if ! python scripts/changed.py; then
            git checkout -- docs/data/jobs.json
            exit 0
          fi

          COUNT=$(python -c "import json;print(len(json.load(open('docs/data/jobs.json'))['jobs']))")
          git add data/seen.json data/companies.json data/logos.json \
                  docs/data/jobs.json docs/data/jobs.js
          git commit -m "chore(data): refresh listings (${COUNT} open roles)"
          git push
